<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Davilanco</title><link rel="stylesheet" href="/css/style.css"><script defer src="/script.js"></script></head><body><header class="site-header"><a class="brand" href="/">DAVILANCO <i>STORE</i></a><a href="/">← Back to store</a></header><main class="container page-main auth-layout"><section><p class="eyebrow">WELCOME TO DAVILANCO</p><h1>Your next great find is just around the corner<span class="gold">.</span></h1><p class="muted">Sign in to manage orders, save your details and access your account.</p></section><section class="panel auth-card"><div class="auth-tabs"><button class="active" data-auth-tab="login">Sign in</button><button data-auth-tab="register">Create account</button></div><form id="loginForm" class="form-stack"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-gold">Sign in ↗</button></form><form id="registerForm" class="form-stack" hidden><label>Full name<input name="name" required maxlength="100"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="10" required></label><small class="muted">At least 10 characters, including a number and symbol.</small><label>Referral code (optional)<input name="referralCode" maxlength="32"></label><button class="btn btn-gold">Create account ↗</button></form><p id="authMessage" class="form-message" role="status"></p></section></main></body></html>
