<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account — Davilanco</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/dashboard-auth.js"></script></head><body><header class="site-header"><a class="brand" href="/">DAVILANCO <i>STORE</i></a><a href="/">← Store</a><button id="themeToggle" class="icon-btn">☼</button></header><main class="container page-main"><div id="dashboardLoading" class="panel">Checking secure session…</div><div id="dashboardContent" hidden><p class="eyebrow">YOUR DAVILANCO ACCOUNT</p><h1>Welcome, <span id="userName">there</span><span class="gold">.</span></h1><div class="dashboard-grid"><section class="panel"><h2>Account details</h2><p id="userEmail"></p><p>Role: <b id="userRole"></b></p><button id="logoutButton" class="btn btn-outline">Sign out</button></section><section class="panel"><h2>Referral link</h2><code id="referralLink"></code><button id="copyReferral" class="btn btn-outline">Copy link</button><p id="referralStats" class="muted"></p></section><section class="panel"><h2>Order history</h2><div id="orderHistory"></div></section><section class="panel"><h2>Change password</h2><form id="passwordForm" class="form-stack"><label>Current password<input name="currentPassword" type="password" required></label><label>New password<input name="newPassword" type="password" minlength="10" required></label><button class="btn btn-gold">Update password</button></form></section><section class="panel"><h2>Contact support</h2><form id="messageForm" class="form-stack"><label>Message<textarea name="body" maxlength="2000" required></textarea></label><button class="btn btn-outline">Send message</button></form></section><section class="panel"><h2>Become a seller</h2><form id="sellerApplyForm" class="form-stack"><label>Business name<input name="businessName" required></label><label>Business details<textarea name="details" required></textarea></label><label>Document URL (optional)<input name="documentUrl" type="url"></label><button class="btn btn-gold">Apply to sell</button></form></section></div></div><p id="dashboardMessage" class="form-message" role="status"></p></main><script src="/script.js" defer></script></body></html>
