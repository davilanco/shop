<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Davilanco</title><link rel="stylesheet" href="/css/style.css"><script defer src="/script.js"></script></head><body><header class="site-header"><a class="brand" href="/">DAVILANCO <i>STORE</i></a><span>SECURE CHECKOUT</span><a href="/cart.html">← Back to bag</a></header><main class="container page-main"><p class="eyebrow">ALMOST YOURS</p><h1>Checkout<span class="gold">.</span></h1><div class="checkout-layout"><form id="checkoutForm" class="panel form-stack"><label>Full name<input name="name" autocomplete="name" required maxlength="100"></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone<input name="phone" autocomplete="tel" required></label><label>Delivery address<textarea name="address" autocomplete="street-address" required></textarea></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label>Order note<textarea name="note"></textarea></label><button class="btn btn-gold">Continue to payment ↗</button><p id="checkoutMessage" role="status" class="form-message"></p><small class="muted">Payments are processed securely by Paystack.</small></form><aside id="checkoutSummary" class="panel"></aside></div></main></body></html>
