<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Davilanco</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/admin/admin.css"><script defer src="/admin/admin.js"></script></head><body><header class="site-header"><a class="brand" href="/">DAVILANCO <i>ADMIN</i></a><a href="/">Store ↗</a></header><main class="container page-main"><p class="eyebrow">CONTROL CENTRE</p><h1>Store overview<span class="gold">.</span></h1><p id="adminMessage" class="form-message" role="status"></p><div id="adminStats" class="admin-stats"></div><section class="panel"><h2>Orders</h2><div id="adminOrders">Loading…</div></section><section class="panel"><h2>Seller applications</h2><div id="sellerApplications">Loading…</div></section><section class="panel"><h2>Users</h2><div id="adminUsers">Loading…</div></section><section class="panel"><h2>Customer messages</h2><div id="adminMessages">Loading…</div></section><section class="panel"><h2>Products</h2><div id="adminProducts">Loading…</div></section><section class="panel"><h2>Create product</h2><form id="productForm" class="admin-form"><input name="name" placeholder="Product name" required><input name="price" type="number" min="1" placeholder="Price NGN" required><select name="category"><option value="locally-made">Locally made</option><option value="imported">Imported</option><option value="others">Others</option></select><input name="image" type="url" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea><input name="stock" type="number" min="0" value="1"><button class="btn btn-gold">Create product</button></form></section></main></body></html>
