<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop all — Davilanco</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/script.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">DAVILANCO <i>STORE</i></a>
      <form class="search" action="/categories.html">
        <input id="searchBar" name="q" placeholder="Search products" aria-label="Search">
        <button>⌕</button>
      </form>
      <nav class="header-actions" aria-label="Breadcrumb">
        <a href="/cart.html">Bag <b id="cartCount" class="count">0</b></a>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☼</button>
        <button id="menuToggle" class="icon-btn" aria-label="Open menu">☰</button>
      </nav>
    </header>
   <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="navDrawer" class="nav-drawer" aria-hidden="true">
      <div class="drawer-head">
        <b>Explore Davilanco</b>
        <button id="menuClose" class="icon-btn" aria-label="Close menu">×</button>
      </div>
      <a href="/">Home</a>
      <a href="/categories.html">All products</a>
      <a href="/category.html?category=locally-made">Locally made</a>
      <a href="/category.html?category=imported">Imported</a>
      <a href="/category.html?category=others">Others</a>
      <a id="navAccount" href="/dashboard.html" hidden>My account</a>
      <a id="navSeller" href="/seller/" hidden>Seller centre</a>
      <a id="navAuth" href="/login.html">Sign in / Register</a>
    </aside>
    <main class="container page-main">
      <p class="eyebrow">THE COMPLETE COLLECTION</p>
      <h1>Shop all products<span class="gold">.</span></h1>
      <div class="toolbar">
        <div class="filter-pills">
          <a class="pill" href="/categories.html">All</a>
          <a class="pill" href="/category.html?category=locally-made">Locally made</a>
          <a class="pill" href="/category.html?category=imported">Imported</a>
          <a class="pill" href="/category.html?category=others">Others</a>
        </div>
        <select id="sortProducts" aria-label="Sort products">
          <option value="newest">Newest</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
        </select>
      </div>
      <div id="productGrid" class="product-grid">Loading products…</div>
    </main>
  </body>
</html>
