<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your bag — Davilanco</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/script.js"></script>
  </head>
  <body>
    <!-- Testing Warning -->
<div id="testingBanner" style="background:#ffcc00;color:#000;text-align:center;padding:10px 14px;font-size:14px;font-weight:700;position:sticky;top:0;z-index:100">
  ⚠️ This site is still in testing — don't make real transaction yet.
  <button id="testingNotifyBtn" style="margin-left:8px;background:#000;color:#ffcc00;border:0;padding:6px 12px;border-radius:20px;cursor:pointer">Notify me when live</button>
  <button id="testingCloseBtn" style="background:transparent;border:0;font-size:18px;cursor:pointer;margin-left:8px">×</button>
</div>

<!-- Notify Popup -->
<div id="notifyModal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px">
  <div style="background:#111;color:#fff;padding:24px;border-radius:16px;max-width:380px;width:100%;text-align:center">
    <h3>We're almost live 🚀</h3>
    <p class="muted">Subscribe and we'll notify you when we're live.</p>
    <form id="notifyForm" style="display:flex;gap:8px;margin-top:12px">
      <input id="notifyEmail" type="email" required placeholder="Your email" style="flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff">
      <button class="btn btn-gold" type="submit">Notify me</button>
    </form>
    <p id="notifyMessage" class="muted" style="margin-top:10px"></p>
    <button id="notifyCloseBtn" style="background:transparent;color:#aaa;border:0;margin-top:8px;cursor:pointer">Close</button>
  </div>
</div>
    <header class="site-header">
      <a class="brand" href="/">DAVILANCO <i>STORE</i></a>
      <a href="/categories.html">Continue shopping ↗</a>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☼</button>
    </header>
    <main class="container page-main">
      <p class="eyebrow">YOUR SELECTION</p>
      <h1>Your bag<span class="gold">.</span></h1>
      <div id="cartView">Loading…</div>
    </main>
  </body>
</html>
