<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Davilanco</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/script.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">DAVILANCO <i>STORE</i></a>
    <a href="/">← Back to store</a>
  </header>
  <main class="container page-main auth-layout">
    <section>
      <p class="eyebrow">WELCOME TO DAVILANCO</p>
      <h1>Your next great find is just around the corner<span class="gold">.</span></h1>
      <p class="muted">Sign in to manage orders, save your details and access your account.</p>
    </section>
    <section class="panel auth-card">
      <h2>Sign in</h2>
      <form id="loginForm" class="form-stack">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-gold">Sign in ↗</button>
      </form>
      <p class="muted" style="margin-top:16px;text-align:center;">
        No account? <a href="/register.html">Create account →</a>
      </p>
      <p id="authMessage" class="form-message" role="status"></p>
    </section>
  </main>
</body>
</html>
