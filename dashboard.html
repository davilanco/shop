<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My account — Davilanco</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/script.js" defer></script>
</head>
  <body>
    <header class="site-header">
  <a class="brand" href="/">DAVILANCO <i>STORE</i></a>
  <a href="/">← Store</a>
  <nav class="header-actions" aria-label="Breadcrumb">
    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☼</button>
    <button id="menuToggle" class="icon-btn" aria-label="Open menu" aria-expanded="false">☰</button>
  </nav>
</header>

<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<aside id="navDrawer" class="nav-drawer" aria-hidden="true">
  <div class="drawer-head">
    <b>Menu</b>
    <button id="menuClose" class="icon-btn" aria-label="Close menu">×</button>
  </div>
  <a href="/">Home</a>
  <a href="/dashboard.html">My account</a>
  <a id="nav-verify" href="/verify-email.html" style="display:none">
  Verify email <span class="badge">!</span>
</a>
  <a id="navSeller" href="/seller/" hidden>Seller centre</a>
  <a id="navAdmin" href="/admin/" hidden>Admin</a>
  <a href="/categories.html">Shop</a>
  <button id="logoutNav" class="btn btn-outline" type="button" style="margin-top:12px">Sign out</button>
</aside>
    <main class="container page-main">
      <div id="dashboardLoading" class="panel">Checking secure session…</div>
      <div id="dashboardContent" hidden>
        <p class="eyebrow">YOUR DAVILANCO ACCOUNT</p>
        <h1>Welcome back, <span id="userName">there</span><span class="gold">.</span></h1>
        <div class="dashboard-grid">
          <section class="panel">
            <h2>Account details</h2>
            <p id="userEmail"></p>
            <p>Role: <b id="userRole"></b></p>
            <button id="logoutButton" class="btn btn-outline">Sign out</button>
          </section>
          <section class="panel">
            <h2>Referral link</h2>
            <code id="referralLink"></code>
            <button id="copyReferral" class="btn btn-outline">Copy link</button>
            <p id="referralStats" class="muted"></p>
          </section>
          <section class="panel">
            <h2>Order history</h2>
            <div id="orderHistory"></div>
          </section>
          <section class="panel">
            <h2>Change password</h2>
            <form id="passwordForm" class="form-stack">
              <label>
                Current password<input name="currentPassword" type="password" required>
              </label>
              <label>
                New password<input name="newPassword" type="password" minlength="10" required>
              </label>
              <button class="btn btn-gold">Update password</button>
            </form>
          </section>
          <section class="panel">
            <h2>Contact support</h2>
            <form id="messageForm" class="form-stack">
              <label>
                Message<textarea name="body" maxlength="2000" required></textarea>
              </label>
              <button class="btn btn-outline">Send message</button>
            </form>
          </section>
          <section class="panel">
            <h2>Become a seller</h2>
            <form id="sellerApplyForm" class="form-stack">
              <label>Business name<input name="businessName" required></label>
              <label>Business details<textarea name="details" required></textarea></label>
              <label>Document URL (optional)<input name="documentUrl" type="url"></label>
              <button class="btn btn-gold">Apply to sell</button>
            </form>
          </section>
        </div>
      </div>
      <p id="dashboardMessage" class="form-message" role="status"></p>
    </main>
  </body>
</html>
