<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account — Davilanco</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/script.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">DAVILANCO <i>STORE</i></a>
    <a href="/">← Back to store</a>
  </header>
  <main class="container page-main auth-layout">
    <section>
      <p class="eyebrow">JOIN DAVILANCO</p>
      <h1>Create your account<span class="gold">.</span></h1>
      <p class="muted">Save your cart across devices, track orders and checkout faster.</p>
    </section>
    <section class="panel auth-card">
      <h2>Create account</h2>
      <form id="registerForm" class="form-stack">
        <label>Full name<input name="name" required maxlength="100"></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Password<input name="password" type="password" minlength="10" required></label>
        <small class="muted">At least 10 characters, including a number and symbol.</small>
        <label>Referral code (optional)<input name="referralCode" maxlength="32"></label>
        <button class="btn btn-gold">Create account ↗</button>
      </form>
      <p class="muted" style="margin-top:16px;text-align:center;">
        Already have an account? <a href="/login.html">Sign in →</a>
      </p>
      <p id="authMessage" class="form-message" role="status"></p>
    </section>
  </main>
</body>
</html>
